</style></head><body><header><div class="brand"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MCA0MCIgZmlsbD0ibm9uZSI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiByeD0iMTIiIGZpbGw9IiMzODU2RjYiLz48cGF0aCBkPSJNMTAgMjZWMTdtMjAgOVYxN00xMCAyM2MzLTEwIDE3LTEwIDIwIDBNOCAyN2gyNCIgc3Ryb2tlPSJ3aGl0ZSIgc3Ryb2tlLXdpZHRoPSIyLjciIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjxwYXRoIGQ9Ik0xNyAyNnYtNG02IDR2LTQiIHN0cm9rZT0id2hpdGUiIHN0cm9rZS13aWR0aD0iMi4zIiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48L3N2Zz4K" alt="">Bridge</div><div class="demo-label">Демонстрационный ролик · настоящий интерфейс расширения</div></header><main><div id="movie_player" class="html5-video-player"><video muted autoplay loop playsinline></video><div class="scene"></div><div class="lesson"><p>СЛУШАЙТЕ В СВОЁМ РИТМЕ</p><h1>Меньше чтения.<br>Больше понимания.</h1><span>Доступные субтитры — выбранным голосом.</span></div><div class="ytp-caption-window-container" style="visibility:hidden"></div><div class="player-bottom"></div><div class="ytp-right-controls"><button class="fixture-control ytp-subtitles-button" aria-label="Субтитры" aria-pressed="false">CC</button><button class="fixture-control" aria-label="Настройки">⚙</button><button class="fixture-control" aria-label="Полный экран">⛶</button></div></div><div class="below"><strong>Субтитры становятся голосом</strong><span>Для работы нужны доступные текстовые дорожки</span></div></main><script>
  const gear = document.querySelector('[aria-label="Настройки"]');
  gear.classList.add("ytp-settings-button");
  gear.setAttribute("aria-expanded", "false");
  const menu = document.createElement("div");
  menu.className = "ytp-settings-menu";
  menu.style.cssText = "display:none;position:absolute;right:20px;bottom:70px;background:#222b40;padding:16px;z-index:5";
  document.querySelector("#movie_player").append(menu);
  const scenario = new URL(location.href).searchParams.get("v");
  const originalLanguage = scenario === "russian_source" ? "ru" : scenario === "korean_source" ? "ko" : "en";
  const originalLabel = originalLanguage === "ru" ? "Русский" : originalLanguage === "ko" ? "Корейский (создано автоматически)" : "English";
  let selected = originalLabel;
  document.documentElement.dataset.captionLanguage = originalLanguage;
  const metadata = document.createElement("script");
  metadata.textContent = "var ytInitialPlayerResponse = " + JSON.stringify({
    videoDetails: { videoId: new URL(location.href).searchParams.get("v") },
    captions: { playerCaptionsTracklistRenderer: {
      captionTracks: [{ languageCode: originalLanguage, name: { simpleText: originalLabel }, kind: "asr", isTranslatable: true }],
      audioTracks: [{ captionTrackIndices: [0] }], defaultAudioTrackIndex: 0,
      translationLanguages: [{ languageCode: "ru" }, { languageCode: "en" }, { languageCode: "de" }]
    } }
  }) + ";";
  document.head.append(metadata);
  const row = (label, action, radio = false) => {
    const element = document.createElement("div"); element.className = "ytp-menuitem";
    element.style.cssText = "padding:8px;cursor:pointer";
    element.setAttribute("role", radio ? "menuitemradio" : "menuitem");
    if (radio) element.setAttribute("aria-checked", String(label === selected));
    const text = document.createElement("div"); text.className = "ytp-menuitem-label"; text.textContent = label;
    element.append(text); element.addEventListener("click", action); return element;
  };
  function panel(title) {
    menu.replaceChildren();
    const element = document.createElement("div"); element.className = "ytp-panel";
    if (title) { const heading = document.createElement("div"); heading.className = "ytp-panel-title"; heading.textContent = title; element.append(heading); }
    menu.append(element); return element;
  }
  function rootMenu() {
    const element = panel("");
    const captions = row("Субтитры", tracksMenu);
    const content = document.createElement("div"); content.className = "ytp-menuitem-content"; content.textContent = selected;
    captions.append(content); element.append(captions);
  }
  function choose(label, language, translated = false) {
    selected = translated ? `${originalLabel} >> ${label}` : label;
    document.documentElement.dataset.captionLanguage = language;
    rootMenu();
  }
  function tracksMenu() {
    const element = panel("Субтитры");
    element.append(row(selected, () => {}, true));
    if (selected !== originalLabel) element.append(row(originalLabel, () => choose(originalLabel, originalLanguage), true));
    if (document.documentElement.dataset.directRussian === "true") element.append(row("Русский", () => choose("Русский", "ru"), true));
    if (scenario === "korean_source") element.append(row("Русский (создано автоматически)", () => choose("Русский (создано автоматически)", "ru"), true));
    const translateLabel = new URL(location.href).searchParams.get("v") === "legacy_translation" ? "Автоперевод" : "Перевести";
    if (document.documentElement.dataset.noTranslation !== "true") element.append(row(translateLabel, () => {
      document.documentElement.dataset.translationMenuOpens = String(Number(document.documentElement.dataset.translationMenuOpens || 0) + 1);
      const languages = panel(translateLabel);
      for (const [label, language] of [["Русский", "ru"], ["Deutsch", "de"], ["Español", "es"], ["English", "en"], ["O‘zbekcha", "uz"]]) {
        if (document.documentElement.dataset.missingRussian === "true" && language === "ru") continue;
        languages.append(row(label, () => choose(label, language, true), true));
      }
    }));
  }
  gear.addEventListener("click", () => {
    const open = gear.getAttribute("aria-expanded") !== "true";
    gear.setAttribute("aria-expanded", String(open));
    menu.style.display = open ? "block" : "none";
    if (open) rootMenu();
  });
  document.documentElement.dataset.captionClicks = "0";
  document.querySelector(".ytp-subtitles-button").addEventListener("click", (event) => {
    const button = event.currentTarget;
    const on = button.getAttribute("aria-pressed") !== "true";
    button.setAttribute("aria-pressed", String(on));
    document.querySelector(".ytp-caption-window-container").style.visibility = on ? "visible" : "hidden";
    document.documentElement.dataset.captionClicks = String(Number(document.documentElement.dataset.captionClicks) + 1);
  });
</script></body></html>
