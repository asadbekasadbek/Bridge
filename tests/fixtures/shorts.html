<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Shorts — Bridge fixture</title>
<style>
body{margin:0;background:#10131c;color:white;font:16px Arial}header{padding:20px}main{margin:0 auto;width:360px}ytd-reel-video-renderer{display:block;position:relative;width:360px;height:640px;background:linear-gradient(145deg,#27344e,#111722);border-radius:14px;overflow:hidden}ytd-reel-video-renderer[hidden]{display:none}.html5-video-player{position:absolute;inset:0;z-index:0}video{width:100%;height:100%;opacity:.01}.ytp-caption-window-container{position:absolute;bottom:190px;left:10px;right:10px;text-align:center;font-size:22px}ytd-shorts-player-controls{display:flex;position:absolute;top:12px;right:12px;gap:10px}button{cursor:pointer}.short-title{position:absolute;bottom:30px;left:15px;pointer-events:none}.fixture-native-overlay{position:absolute;inset:0;z-index:1;pointer-events:none}.fixture-native-overlay a{position:absolute;bottom:12px;left:12px;right:12px;height:42px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;color:white;text-decoration:none;pointer-events:auto;background:#ffffff12}yt-sheet-view-model{position:fixed;right:12px;top:100px;z-index:200;background:#222b3b;color:#fff;min-width:260px;padding:16px;border-radius:12px}yt-sheet-view-model[hidden]{display:none}yt-list-item-view-model{display:block;padding:12px;cursor:pointer}.ytListItemViewModelSelectionText{display:block;color:#abb9d2;font-size:13px}yt-list-item-view-model[aria-checked=true]{background:#3c4c6c}#all-in-one-downloader-daniel{position:absolute;top:80px;left:12px}
</style></head><body><header>Shorts · локальная проверка Bridge</header>
<div id="movie_player" class="html5-video-player" style="display:none"><video></video><div class="ytp-right-controls"></div></div>
<main><ytd-reel-video-renderer id="active-short"><div class="player-container"><div id="shorts-player" class="html5-video-player"><video muted loop playsinline></video><div class="ytp-caption-window-container"></div></div><ytd-shorts-player-controls><div id="right-controls"><button class="ytmClosedCaptioningButtonButton" aria-label="Субтитры отключены." aria-pressed="false">CC</button><div id="menu-button"><button aria-label="Ещё">⋮</button></div></div></ytd-shorts-player-controls></div><div class="fixture-native-overlay"><a href="#native-title" onclick="event.preventDefault();document.documentElement.dataset.nativeClicks=String(Number(document.documentElement.dataset.nativeClicks||0)+1)">АЙФОН ВЫДЕРЖАЛ 32 ТЫСЯЧИ СГИБАНИЙ</a></div><div id="all-in-one-downloader-daniel"><button>Скачать на другом сайте</button></div></ytd-reel-video-renderer><ytd-reel-video-renderer id="next-short" hidden><div class="player-container"></div><p class="short-title">Следующее короткое видео</p></ytd-reel-video-renderer></main>
<ytd-popup-container><yt-sheet-view-model hidden><yt-contextual-sheet-layout><h2></h2><yt-list-view-model role="menu"></yt-list-view-model></yt-contextual-sheet-layout></yt-sheet-view-model></ytd-popup-container>
<script>
  const sheet=document.querySelector('yt-sheet-view-model'), menu=sheet.querySelector('[role="menu"]'), heading=sheet.querySelector('h2');
  const cc=document.querySelector('.ytmClosedCaptioningButtonButton');
  const autoOnly=location.pathname.includes('auto'), missing=location.pathname.includes('missing');
  let selected='English', target='en';
  document.documentElement.dataset.captionLanguage=target;
  cc.onclick=()=>{const on=cc.getAttribute('aria-pressed')!=='true';cc.setAttribute('aria-pressed',on);document.querySelector('#shorts-player .ytp-caption-window-container').style.visibility=on?'visible':'hidden';};
  function row(title,action,radio=false){
    const item=document.createElement('yt-list-item-view-model');item.setAttribute('role',radio?'menuitemradio':'menuitem');
    if(radio)item.setAttribute('aria-checked',String(title===selected));
    const label=document.createElement('span');label.className='ytListItemViewModelTitle';label.textContent=title;item.append(label);item.onclick=action;return item;
  }
  function show(title){sheet.hidden=false;heading.textContent=title;menu.replaceChildren();}
  function choose(label,language){selected=label;target=language;document.documentElement.dataset.captionLanguage=language;sheet.hidden=true;}
  function translations(){show('Автоперевод');for(const [label,code]of[['Русский','ru'],['Deutsch','de']])menu.append(row(label,()=>choose('English >> '+label,code),true));}
  function captions(){show('Субтитры');menu.append(row('English',()=>choose('English','en'),true));if(!autoOnly)menu.append(row('Русский',()=>choose('Русский','ru'),true));menu.append(row('Автоперевод',translations,true));}
  function root(){show('Меню Shorts');if(!missing){const item=row('Субтитры',captions);const value=document.createElement('span');value.className='ytListItemViewModelSelectionText';value.textContent=selected;item.append(value);menu.append(item);}menu.append(row('Скорость воспроизведения',()=>{show('Скорость воспроизведения');menu.append(row('Обычная',()=>{sheet.hidden=true;},true));}));}
  document.querySelector('#menu-button button').onclick=root;
  document.addEventListener('keydown',(event)=>{if(event.key==='Escape')sheet.hidden=true;});
  window.fixtureCaption=(text)=>{const layer=document.querySelector('#shorts-player .ytp-caption-window-container');layer.replaceChildren();if(text){const span=document.createElement('span');span.className='ytp-caption-segment';span.textContent=text;layer.append(span);}};
  window.fixtureNextShort=()=>{
    history.pushState({},'', '/shorts/next_video');
    const previous=document.querySelector('#active-short'),next=document.querySelector('#next-short');
    next.querySelector('.player-container').append(document.querySelector('#shorts-player'),document.querySelector('ytd-shorts-player-controls'));
    previous.hidden=true;next.hidden=false;sheet.hidden=true;selected='English';target='en';document.documentElement.dataset.captionLanguage='en';
  };
</script></body></html>
